[package]
name = "vellichor"
version = "0.1.0"
description = "Bidirectionally cross-device control, screens share and devices control."
authors = ["Wambua Mwikya aka Skye <swskye17@gmail.com>"]
license = "GNU"
repository = "https://github.com/skye-cyber/vellichor"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vellichor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
# Global shortcut is desktop-only — this prevents Android/iOS build failures
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
debug = false
